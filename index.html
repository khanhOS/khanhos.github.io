<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0b">

  <title>KhanhOS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: #fff;
      overflow: hidden;
    }

    button,
    textarea {
      font-family: inherit;
    }

    /* =========================
       APP
    ========================= */

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
      background: #0b0b0b;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 260px;
      height: 100vh;
      flex-shrink: 0;

      display: flex;
      flex-direction: column;

      padding: 18px;

      background: #101010;
      border-right: 1px solid #242424;
    }

    /* =========================
       BRAND
    ========================= */

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 25px;
    }

    /* LOGO TẠM THỜI - KHÔNG CẦN FILE */

    .brand-logo {
      width: 44px;
      height: 44px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;

      background: linear-gradient(
        135deg,
        #171717,
        #292929
      );

      border: 1px solid #383838;

      color: #fff;

      font-size: 22px;
      font-weight: 800;

      letter-spacing: -1px;

      box-shadow:
        0 0 25px rgba(255,255,255,0.05);
    }

    .brand-name {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    /* =========================
       NEW CHAT
    ========================= */

    .new-chat {
      width: 100%;

      display: flex;
      align-items: center;

      gap: 9px;

      padding: 12px 13px;

      border: 1px solid #303030;
      border-radius: 12px;

      background: #181818;
      color: #fff;

      font-size: 14px;

      cursor: pointer;

      transition: 0.2s;
    }

    .new-chat:hover {
      background: #222;
      border-color: #3b3b3b;
    }

    /* =========================
       CHAT LIST
    ========================= */

    .chat-list {
      flex: 1;
      margin-top: 18px;
      overflow-y: auto;
    }

    .chat-item {
      width: 100%;

      padding: 11px 12px;
      margin-bottom: 4px;

      border-radius: 10px;

      color: #bdbdbd;

      font-size: 14px;

      cursor: pointer;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      transition: 0.2s;
    }

    .chat-item:hover {
      background: #1d1d1d;
      color: #fff;
    }

    /* =========================
       SIDEBAR BOTTOM
    ========================= */

    .sidebar-bottom {
      padding-top: 12px;
      border-top: 1px solid #252525;
    }

    .sidebar-button {
      width: 100%;

      display: flex;
      align-items: center;

      gap: 10px;

      padding: 11px 12px;

      border: 0;
      border-radius: 10px;

      background: transparent;

      color: #bdbdbd;

      text-align: left;

      cursor: pointer;

      transition: 0.2s;
    }

    .sidebar-button:hover {
      background: #1d1d1d;
      color: #fff;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      width: calc(100% - 260px);
      height: 100vh;

      display: flex;
      flex-direction: column;

      position: relative;
    }

    /* =========================
       TOPBAR
    ========================= */

    .topbar {
      height: 64px;
      flex-shrink: 0;

      display: flex;
      align-items: center;

      padding: 0 24px;

      border-bottom: 1px solid #242424;

      background: rgba(11,11,11,0.95);
    }

    .topbar-title {
      font-size: 15px;
      font-weight: 600;
    }

    /* =========================
       MESSAGES
    ========================= */

    .messages {
      flex: 1;

      overflow-y: auto;

      padding:
        30px
        20px
        170px;

      scroll-behavior: smooth;
    }

    /* =========================
       WELCOME
    ========================= */

    .welcome {
      width: 100%;
      max-width: 760px;

      margin: 13vh auto 0;

      text-align: center;
    }

    /* LOGO LỚN TẠM THỜI */

    .welcome-logo {
      width: 90px;
      height: 90px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin: 0 auto 20px;

      border-radius: 21px;

      background: linear-gradient(
        135deg,
        #151515,
        #292929
      );

      border: 1px solid #383838;

      color: #fff;

      font-size: 43px;
      font-weight: 800;

      letter-spacing: -3px;

      box-shadow:
        0 0 40px rgba(255,255,255,0.06);
    }

    .welcome h1 {
      font-size: 32px;
      line-height: 1.2;

      margin-bottom: 10px;

      letter-spacing: -0.8px;
    }

    .welcome p {
      color: #777;
      font-size: 15px;
    }

    /* =========================
       MESSAGES
    ========================= */

    .message {
      width: 100%;
      max-width: 760px;

      margin: 0 auto 18px;

      padding: 13px 16px;

      border-radius: 14px;

      font-size: 15px;
      line-height: 1.65;

      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user {
      background: #1c1c1c;
      border: 1px solid #282828;
    }

    .message.ai {
      background: transparent;
      color: #eee;
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer-area {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      padding:
        20px
        20px
        15px;

      background:
        linear-gradient(
          to bottom,
          transparent,
          #0b0b0b 35%
        );
    }

    .composer {
      width: 100%;
      max-width: 760px;

      margin: 0 auto;

      display: flex;
      align-items: flex-end;

      gap: 8px;

      padding: 9px;

      border: 1px solid #303030;
      border-radius: 18px;

      background: #151515;

      box-shadow:
        0 8px 35px rgba(0,0,0,0.25);
    }

    .composer textarea {
      flex: 1;

      width: 100%;

      min-height: 42px;
      max-height: 160px;

      resize: none;

      border: 0;
      outline: 0;

      padding: 11px;

      background: transparent;

      color: #fff;

      font-size: 15px;
      line-height: 20px;
    }

    .composer textarea::placeholder {
      color: #737373;
    }

    /* =========================
       SEND
    ========================= */

    .send-button {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      border: 0;
      border-radius: 12px;

      background: #fff;
      color: #000;

      font-size: 18px;
      font-weight: 700;

      cursor: pointer;

      transition: 0.15s;
    }

    .send-button:hover {
      opacity: 0.85;
    }

    .send-button:active {
      transform: scale(0.94);
    }

    /* =========================
       NOTE
    ========================= */

    .note {
      max-width: 760px;

      margin: 8px auto 0;

      text-align: center;

      color: #5e5e5e;

      font-size: 11px;
    }

    /* =========================
       SETTINGS MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      background: rgba(0,0,0,0.65);

      z-index: 100;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: min(
        420px,
        calc(100% - 30px)
      );

      padding: 22px;

      border: 1px solid #303030;
      border-radius: 18px;

      background: #151515;

      box-shadow:
        0 20px 70px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 20px;
    }

    .modal-header h2 {
      font-size: 18px;
    }

    .close-button {
      width: 34px;
      height: 34px;

      border: 0;
      border-radius: 9px;

      background: #222;
      color: #fff;

      cursor: pointer;

      font-size: 18px;
    }

    .setting-row {
      padding: 14px 0;

      border-bottom: 1px solid #262626;

      color: #cfcfcf;

      font-size: 14px;
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .sidebar {
        display: none;
      }

      .main {
        width: 100%;
      }

      .topbar {
        height: 58px;
        padding: 0 16px;
      }

      .messages {
        padding:
          20px
          12px
          160px;
      }

      .welcome {
        margin-top: 12vh;
      }

      .welcome-logo {
        width: 78px;
        height: 78px;

        border-radius: 18px;

        font-size: 38px;
      }

      .welcome h1 {
        font-size: 27px;
      }

      .composer-area {
        padding:
          12px
          10px
          12px;
      }

      .composer {
        border-radius: 16px;
      }

      .note {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

      <div class="brand">

        <!-- LOGO TẠM THỜI -->
        <div class="brand-logo">
          K
        </div>

        <div class="brand-name">
          KhanhOS
        </div>

      </div>


      <button
        class="new-chat"
        onclick="newChat()"
      >
        <span>＋</span>

        <span>
          Cuộc trò chuyện mới
        </span>
      </button>


      <div
        class="chat-list"
        id="chatList"
      ></div>


      <div class="sidebar-bottom">

        <button
          class="sidebar-button"
          onclick="openSettings()"
        >
          <span>⚙️</span>

          <span>
            Cài đặt
          </span>
        </button>

      </div>

    </aside>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">

      <header class="topbar">

        <div class="topbar-title">
          KhanhOS
        </div>

      </header>


      <!-- =========================
           CHAT AREA
      ========================= -->

      <section
        class="messages"
        id="messages"
      >

        <div
          class="welcome"
          id="welcome"
        >

          <!-- LOGO TẠM THỜI -->
          <div class="welcome-logo">
            K
          </div>


          <h1>
            Xin chào 👋
          </h1>


          <p>
            Tôi là KhanhOS. Cốt muốn làm gì hôm nay?
          </p>

        </div>

      </section>


      <!-- =========================
           MESSAGE INPUT
      ========================= -->

      <div class="composer-area">

        <div class="composer">

          <textarea
            id="input"
            rows="1"
            placeholder="Nhắn tin cho KhanhOS..."
          ></textarea>


          <button
            class="send-button"
            onclick="sendMessage()"
          >
            ↑
          </button>

        </div>


        <div class="note">
          KhanhOS có thể mắc lỗi. Hãy kiểm tra thông tin quan trọng.
        </div>

      </div>

    </main>

  </div>


  <!-- =========================
       SETTINGS
  ========================= -->

  <div
    class="modal"
    id="settingsModal"
    onclick="closeSettingsOutside(event)"
  >

    <div class="modal-box">

      <div class="modal-header">

        <h2>
          Cài đặt KhanhOS
        </h2>


        <button
          class="close-button"
          onclick="closeSettings()"
        >
          ×
        </button>

      </div>


      <div class="setting-row">
        🤖 Model: KhanhOS
      </div>


      <div class="setting-row">
        🌐 Provider: OpenAI
      </div>


      <div class="setting-row">
        🎨 Giao diện: Dark
      </div>


      <div class="setting-row">
        🚀 KhanhOS AI
      </div>

    </div>

  </div>


  <script>

    /* =========================
       ELEMENTS
    ========================= */

    const messages =
      document.getElementById("messages");

    const input =
      document.getElementById("input");

    const chatList =
      document.getElementById("chatList");

    const settingsModal =
      document.getElementById("settingsModal");


    /* =========================
       CHAT STORAGE
    ========================= */

    let chats = [];

    try {

      const saved =
        JSON.parse(
          localStorage.getItem(
            "khanhos_chats"
          )
        );

      if (Array.isArray(saved)) {
        chats = saved;
      }

    } catch {

      chats = [];

    }


    /* =========================
       RENDER CHAT LIST
    ========================= */

    function renderChats() {

      chatList.innerHTML = "";

      chats
        .slice()
        .reverse()
        .forEach(chat => {

          const item =
            document.createElement("div");

          item.className = "chat-item";

          item.textContent = chat.text;

          chatList.appendChild(item);

        });

    }


    /* =========================
       SAVE CHAT
    ========================= */

    function saveChat(text) {

      chats.push({
        text: text,
        time: Date.now()
      });

      localStorage.setItem(
        "khanhos_chats",
        JSON.stringify(chats)
      );

      renderChats();

    }


    /* =========================
       ADD MESSAGE
    ========================= */

    function addMessage(text, type) {

      const message =
        document.createElement("div");

      message.className =
        "message " + type;

      message.textContent = text;

      messages.appendChild(message);

      messages.scrollTop =
        messages.scrollHeight;

    }


    /* =========================
       SEND MESSAGE
    ========================= */

    function sendMessage() {

      const text =
        input.value.trim();

      if (!text) {
        return;
      }


      const welcome =
        document.getElementById("welcome");

      if (welcome) {
        welcome.style.display = "none";
      }


      addMessage(
        text,
        "user"
      );


      input.value = "";

      input.style.height = "42px";


      saveChat(text);


      /*
        DEMO RESPONSE

        Đây chỉ là giao diện demo.
        Sau này có thể kết nối API AI.
      */

      setTimeout(() => {

        addMessage(
          "KhanhOS đã nhận tin nhắn của cốt 😎",
          "ai"
        );

      }, 500);

    }


    /* =========================
       ENTER TO SEND
    ========================= */

    input.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* =========================
       TEXTAREA AUTO RESIZE
    ========================= */

    input.addEventListener(
      "input",
      function() {

        this.style.height = "42px";

        this.style.height =
          Math.min(
            this.scrollHeight,
            160
          ) + "px";

      }
    );


    /* =========================
       NEW CHAT
    ========================= */

    function newChat() {

      messages.innerHTML = `

        <div
          class="welcome"
          id="welcome"
        >

          <div class="welcome-logo">
            K
          </div>

          <h1>
            Cuộc trò chuyện mới 👋
          </h1>

          <p>
            Nhắn tin cho KhanhOS...
          </p>

        </div>

      `;


      input.value = "";

      input.style.height = "42px";

      input.focus();

    }


    /* =========================
       SETTINGS
    ========================= */

    function openSettings() {

      settingsModal.classList.add(
        "active"
      );

    }


    function closeSettings() {

      settingsModal.classList.remove(
        "active"
      );

    }


    function closeSettingsOutside(event) {

      if (
        event.target ===
        settingsModal
      ) {

        closeSettings();

      }

    }


    /* =========================
       START
    ========================= */

    renderChats();

  </script>

</body>
</html>
