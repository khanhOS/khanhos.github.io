<body>

  <div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="brand">

        <img
          class="brand-logo"
          src="./logo.jpn"
          alt="KhanhOS"
        >

        <div class="brand-name">
          KhanhOS
        </div>

      </div>

      <button
        class="new-chat"
        onclick="newChat()"
      >

        <span>＋</span>

        <span>
          Cuộc trò chuyện mới
        </span>

      </button>

      <div
        class="chat-list"
        id="chatList"
      ></div>

      <div class="sidebar-bottom">

        <button
          class="sidebar-button"
          onclick="openSettings()"
        >

          <span>⚙️</span>

          <span>
            Cài đặt
          </span>

        </button>

      </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

      <header class="topbar">

        <div class="topbar-title">
          KhanhOS
        </div>

      </header>


      <!-- MESSAGES -->

      <section
        class="messages"
        id="messages"
      >

        <div
          class="welcome"
          id="welcome"
        >

          <img
            class="welcome-logo"
            src="./logo.jpn"
            alt="KhanhOS Logo"
          >

          <h1>
            Xin chào 👋
          </h1>

          <p>
            Tôi là KhanhOS. Cốt muốn làm gì hôm nay?
          </p>

        </div>

      </section>


      <!-- COMPOSER -->

      <div class="composer-area">

        <div class="composer">

          <textarea
            id="input"
            rows="1"
            placeholder="Nhắn tin cho KhanhOS..."
          ></textarea>

          <button
            class="send-button"
            onclick="sendMessage()"
          >
            ↑
          </button>

        </div>

        <div class="note">
          KhanhOS có thể mắc lỗi. Hãy kiểm tra thông tin quan trọng.
        </div>

      </div>

    </main>

  </div>


  <!-- SETTINGS -->

  <div
    class="modal"
    id="settingsModal"
    onclick="closeSettingsOutside(event)"
  >

    <div class="modal-box">

      <div class="modal-header">

        <h2>
          Cài đặt KhanhOS
        </h2>

        <button
          class="close-button"
          onclick="closeSettings()"
        >
          ×
        </button>

      </div>

      <div class="setting-row">
        🤖 Model: KhanhOS
      </div>

      <div class="setting-row">
        🌐 Provider: OpenAI
      </div>

      <div class="setting-row">
        🎨 Giao diện: Dark
      </div>

      <div class="setting-row">
        🚀 KhanhOS AI
      </div>

    </div>

  </div>


  <script>

    /* =========================
       ELEMENTS
    ========================== */

    const messages =
      document.getElementById(
        "messages"
      );

    const input =
      document.getElementById(
        "input"
      );

    const chatList =
      document.getElementById(
        "chatList"
      );

    const settingsModal =
      document.getElementById(
        "settingsModal"
      );


    /* =========================
       STORAGE
    ========================== */

    let chats = [];

    try {

      const saved =
        JSON.parse(
          localStorage.getItem(
            "khanhos_chats"
          )
        );

      if (
        Array.isArray(saved)
      ) {

        chats = saved;

      }

    } catch {

      chats = [];

    }


    /* =========================
       RENDER
    ========================== */

    function renderChats() {

      chatList.innerHTML = "";

      chats
        .slice()
        .reverse()
        .forEach(
          chat => {

            const item =
              document.createElement(
                "div"
              );

            item.className =
              "chat-item";

            item.textContent =
              chat.text;

            chatList.appendChild(
              item
            );

          }
        );

    }


    /* =========================
       SAVE CHAT
    ========================== */

    function saveChat(text) {

      chats.push({

        text: text,

        time: Date.now()

      });

      localStorage.setItem(
        "khanhos_chats",
        JSON.stringify(
          chats
        )
      );

      renderChats();

    }


    /* =========================
       ADD MESSAGE
    ========================== */

    function addMessage(
      text,
      type
    ) {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "message " + type;

      div.textContent =
        text;

      messages.appendChild(
        div
      );

      messages.scrollTop =
        messages.scrollHeight;

    }


    /* =========================
       SEND
    ========================== */

    function sendMessage() {

      const text =
        input.value.trim();

      if (!text) {
        return;
      }

      const welcome =
        document.getElementById(
          "welcome"
        );

      if (welcome) {

        welcome.style.display =
          "none";

      }

      addMessage(
        text,
        "user"
      );

      input.value = "";

      input.style.height =
        "42px";

      saveChat(text);


      setTimeout(
        () => {

          addMessage(
            "KhanhOS đã nhận tin nhắn của cốt 😎\n\nĐây là giao diện demo. Khi kết nối API/backend, KhanhOS sẽ trả lời bằng AI thật.",
            "ai"
          );

        },
        500
      );

    }


    /* =========================
       ENTER
    ========================== */

    input.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* =========================
       TEXTAREA
    ========================== */

    input.addEventListener(
      "input",
      function() {

        this.style.height =
          "42px";

        this.style.height =
          Math.min(
            this.scrollHeight,
            160
          ) + "px";

      }
    );


    /* =========================
       NEW CHAT
    ========================== */

    function newChat() {

      messages.innerHTML = `

        <div
          class="welcome"
          id="welcome"
        >

          <img
            class="welcome-logo"
            src="./logo.jpn"
            alt="KhanhOS Logo"
          >

          <h1>
            Cuộc trò chuyện mới 👋
          </h1>

          <p>
            Nhắn tin cho KhanhOS...
          </p>

        </div>

      `;

      input.value = "";

      input.style.height =
        "42px";

      input.focus();

    }


    /* =========================
       SETTINGS
    ========================== */

    function openSettings() {

      settingsModal.classList.add(
        "active"
      );

    }


    function closeSettings() {

      settingsModal.classList.remove(
        "active"
      );

    }


    function closeSettingsOutside(
      event
    ) {

      if (
        event.target ===
        settingsModal
      ) {

        closeSettings();

      }

    }


    /* =========================
       START
    ========================== */

    renderChats();

  </script>

</body>
</html>
